name: One-off chat diagnostic
on:
  push:
    branches: [diagnostics/chat-20261017]
    paths: [.github/workflows/chat-diagnostic.yml]
permissions:
  contents: read
concurrency:
  group: chat-diagnostic-20261017
  cancel-in-progress: false
jobs:
  diagnostic:
    if: github.repository == 'a48zhang/cheapai-service'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Read only natural failures from 08:35 through 09:40 UTC
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node --experimental-transform-types scripts/one-off-gpt55-investigation.mjs
