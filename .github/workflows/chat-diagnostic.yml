name: One-off chat diagnostic
# Same temporary account; authorized internal USD 0.01 ledger grant.
on:
  push:
    branches: [diagnostics/chat-20261017]
    paths: [.github/workflows/chat-diagnostic.yml]
permissions:
  contents: read
concurrency:
  group: chat-diagnostic-20261017
  cancel-in-progress: false
jobs:
  diagnostic:
    if: github.repository == 'a48zhang/cheapai-service'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies --registry=https://registry.npmjs.org
      - name: Create temporary ordinary account and diagnose chat once
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node --experimental-strip-types scripts/one-off-chat-diagnostic.ts
