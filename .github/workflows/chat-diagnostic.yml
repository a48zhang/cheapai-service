name: One-off chat diagnostic
# Read exact constraint and invocation markers after log permission grant.
on:
  push:
    branches: [diagnostics/chat-20261017]
    paths: [.github/workflows/chat-diagnostic.yml]
permissions:
  contents: read
concurrency:
  group: chat-diagnostic-20261017
  cancel-in-progress: false
jobs:
  diagnostic:
    if: github.repository == 'a48zhang/cheapai-service'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies --registry=https://registry.npmjs.org
      - name: Read exact failed-request Worker logs only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DIAGNOSTIC_REQUEST_IDS: '["8e07136a-d5e0-4118-9730-ff14d57882df","b99ede31-2664-4d19-a2bf-76bf8b534c28"]'
        run: node scripts/one-off-chat-log-query.mjs
