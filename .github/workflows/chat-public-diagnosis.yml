name: Read-only chat endpoint diagnosis

on:
  push:
    branches: [diagnostic/chat-public-endpoints]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Inspect public pages and unauthenticated API routes
        run: |
          node --input-type=module <<'JS'
          const origins = ['https://cheapai.dev', 'https://www.cheapai.dev', 'https://pre.cheapai.dev'];
          const paths = ['/chat', '/healthz', '/api/v1/settings/public', '/api/v1/auth/me'];
          await Promise.all(origins.flatMap(origin => paths.map(async path => {
            const url = origin + path;
            try {
              const response = await fetch(url, { signal: AbortSignal.timeout(15000), redirect: 'follow' });
              const body = await response.text();
              let json;
              try { json = JSON.parse(body); } catch {}
              console.log(JSON.stringify({
                url, final_url: response.url, status: response.status,
                content_type: response.headers.get('content-type'),
                cf_ray: response.headers.get('cf-ray'),
                csp: path === '/chat' ? response.headers.get('content-security-policy') : undefined,
                script_assets: path === '/chat' ? [...body.matchAll(/src="([^"]+\.js)"/g)].map(match => match[1]) : undefined,
                health: path === '/healthz' ? json : undefined,
                settings: path === '/api/v1/settings/public' && json?.data ? {
                  keys: Object.keys(json.data), csrf_token_present: typeof json.data.csrfToken === 'string',
                  csrf_cookie_present: response.headers.get('set-cookie')?.includes('__Host-sub2api_csrf=') ?? false,
                } : undefined,
                api_error: json?.error, request_id: json?.request_id,
                unexpected_body: !json && path !== '/chat' ? body.slice(0,300) : undefined,
              }));
            } catch (error) {
              console.log(JSON.stringify({url, error: String(error), cause: String(error.cause ?? '')}));
            }
          })));
          JS

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Install browser driver
        run: npm install --no-save playwright@1.63.0
      - name: Exercise production frontend with intercepted API writes
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ executablePath: '/usr/bin/google-chrome', headless: true });
          try {
            const page = await browser.newPage();
            const errors = [];
            const writes = [];
            let detail;
            let sequence = 0;
            let rejectNext = false;
            let currentStatus = 200;
            let bootstraps = 0;
            const at = Date.now();
            const user = { id:'probe-user', email_normalized:'probe@example.invalid', role:'user', status:'active',
              group_id:'probe-group', group_status:'active', balance_units:'1000000000', email_verified_at:null };
            const json = (route, data, status=200) => route.fulfill({status, contentType:'application/json',
              body:JSON.stringify({data, request_id:'public-browser-probe'})});
            page.on('pageerror', error => errors.push(String(error)));
            page.on('requestfailed', request => errors.push(request.method()+' '+new URL(request.url()).pathname+' '+request.failure()?.errorText));
            await page.route('**/api/**', async route => {
              const request = route.request();
              const path = new URL(request.url()).pathname;
              if (path === '/api/v1/settings/public' && request.method() === 'GET') {
                bootstraps++;
                return route.continue();
              }
              if (path === '/api/v1/auth/me') return json(route, user);
              if (path === '/api/v1/chat/models') return json(route, {items:[{id:'probe-group',name:'Probe',billingMultiplier:'1',
                models:[{publicModelId:'probe-model'}]}]});
              if (path === '/api/v1/chat/conversations') {
                if (request.method() === 'GET') return json(route, {items:detail?[detail.conversation]:[],nextCursor:null});
                sequence++;
                detail = {conversation:{id:'probe-conversation-'+sequence,title:'Probe',groupId:'probe-group',modelId:'probe-model',
                  version:1,createdAt:at,updatedAt:at},messages:[]};
                return json(route, detail.conversation, 201);
              }
              if (path === '/api/v1/chat/conversations/'+detail?.conversation.id) return json(route, detail);
              if (path.endsWith('/messages') && request.method() === 'POST') {
                const input = request.postDataJSON();
                writes.push({path,version:input.conversationVersion,expected:detail.conversation.version,
                  csrf_present:Boolean(request.headers()['x-csrf-token'])});
                const turn = detail.messages.filter(m=>m.role==='user').length;
                const common = {conversationId:detail.conversation.id,turnIndex:turn,variant:1,selected:true,
                  groupId:'probe-group',modelId:'probe-model',createdAt:at,updatedAt:at};
                const prompt = {...common,id:'user-'+sequence+'-'+turn,role:'user',content:input.content,status:'completed',requestId:null};
                const assistant = {...common,id:'assistant-'+sequence+'-'+turn,role:'assistant',content:'probe streaming answer '+turn,
                  status:rejectNext?'failed':'completed',requestId:'request-'+sequence+'-'+turn};
                detail = {conversation:{...detail.conversation,version:detail.conversation.version+1},messages:[...detail.messages,prompt,assistant]};
                if (rejectNext) {
                  rejectNext=false; currentStatus=400;
                  return route.fulfill({status:400,contentType:'application/json',
                    body:JSON.stringify({error:{code:'invalid_request',message:'Synthetic admission rejection'},request_id:'probe-rejection'})});
                }
                currentStatus=200;
                const frame=(event,data)=>'event: '+event+'\ndata: '+JSON.stringify(data)+'\n\n';
                return route.fulfill({status:200,contentType:'text/event-stream',headers:{'X-Request-Id':assistant.requestId},
                  body:frame('meta',{conversation:detail.conversation,userMessage:prompt,assistantMessage:{...assistant,status:'generating',content:''}})
                    +frame('delta',{text:assistant.content})+frame('done',{message:assistant})});
              }
              // All other API requests are intercepted; no authenticated or write request reaches production.
              return route.fulfill({status:404,contentType:'application/json',
                body:JSON.stringify({error:{code:'not_found',message:'Probe route not mocked'},request_id:'probe-unused'})});
            });
            await page.goto('https://cheapai.dev/chat', {waitUntil:'networkidle'});
            const input=page.getByRole('textbox',{name:'消息内容'});
            const send=page.getByRole('button',{name:'发送',exact:true});
            await input.fill('browser diagnosis');
            await send.click();
            await page.getByRole('log',{name:'对话消息'}).getByText('probe streaming answer 0',{exact:true}).waitFor();
            console.log('PROBE_SUCCESS '+JSON.stringify({writes:[...writes],bootstraps,page_errors:[...errors]}));
            rejectNext=true;
            await input.fill('synthetic admission failure');
            await send.click();
            await page.getByRole('alert').filter({hasText:'消息未能发送'}).waitFor();
            const visibleFailure=await page.getByRole('alert').filter({hasText:'消息未能发送'}).innerText();
            await input.fill('send after rejection');
            await send.click();
            await page.getByRole('log',{name:'对话消息'}).getByText('probe streaming answer 2',{exact:true}).waitFor();
            console.log('PROBE_REJECTION_RECOVERY '+JSON.stringify({writes,currentStatus,visibleFailure,page_errors:errors}));
          } catch(error) {
            console.log('PROBE_BROWSER_FAILURE '+String(error));
            process.exitCode=1;
          } finally {
            await browser.close();
          }
          JS
