name: Desktop installers

on:
  push:
    branches: [main, feat/cheapai-desktop]
    paths: &desktop-paths
      - '.github/workflows/desktop-package.yml'
      - 'apps/desktop/**'
      - 'apps/desktop-runtime/**'
      - 'packages/desktop-contracts/**'
      - 'scripts/desktop/**'
      - 'LICENSES/desktop/**'
      - 'THIRD_PARTY_NOTICES.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
  pull_request:
    paths: *desktop-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-package-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      RUSTUP_TOOLCHAIN: '1.99.0'
      SOURCE_SHA: ${{ github.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Verify Rust pin
        run: |
          node -e "const v=require('./scripts/desktop/runtime-versions.json'); if(v.desktop.tauri.rust_toolchain!==process.env.RUSTUP_TOOLCHAIN) throw Error('Rust pin mismatch')"
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target '${{ matrix.target }}'
          rustc --version
      - name: Resolve dependency locks and install
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile --strict-peer-dependencies --registry=https://registry.npmjs.org
          pnpm install --frozen-lockfile --strict-peer-dependencies --registry=https://registry.npmjs.org
          if [ ! -f apps/desktop/src-tauri/Cargo.lock ]; then
            cargo generate-lockfile --manifest-path apps/desktop/src-tauri/Cargo.toml
          fi
          cargo fetch --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --target '${{ matrix.target }}'
      - name: Record locks in a local build snapshot
        run: |
          git add pnpm-lock.yaml apps/desktop/src-tauri/Cargo.lock
          if ! git diff --cached --quiet; then
            git -c user.name='Desktop CI' -c user.email='desktop-ci@users.noreply.github.com' commit -m 'ci: record resolved desktop dependency locks'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-locks-${{ matrix.target }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            pnpm-lock.yaml
            apps/desktop/src-tauri/Cargo.lock
      - name: Build complete desktop package
        run: GITHUB_SHA="$(git rev-parse HEAD)" pnpm package:desktop -- --runtime node --target '${{ matrix.target }}'
      - name: Verify build preserved source and dependency locks
        run: |
          git diff --exit-code
          node -e "const fs=require('fs'); const root='apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle'; if(!fs.readdirSync(root,{recursive:true}).some(p=>/\.(dmg|exe)$/.test(p))) throw Error('Installer was not produced')"
      - name: Record delivery limits
        run: |
          BUILD_SHA="$(git rev-parse HEAD)" node -e "require('fs').writeFileSync('desktop-delivery-status.txt', ['Source: '+process.env.SOURCE_SHA, 'Build snapshot: '+process.env.BUILD_SHA, 'Target: ${{ matrix.target }}', 'Runtime: node', 'Unsigned development installer; no signing or notarization configured.'].join('\n')+'\n')"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-installer-${{ matrix.target }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/resources/generated/runtime/release-manifest.json
            desktop-delivery-status.txt
