name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: read

# All PRs share preview storage; serialize migrations and Gate host updates.
concurrency:
  group: pr-preview-shared-${{ github.repository_id }}
  cancel-in-progress: false

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Check preview credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Set CLOUDFLARE_API_TOKEN (Actions secret) and CLOUDFLARE_ACCOUNT_ID (Actions variable). See docs/pr-previews.md.'
            echo 'Preview blocked: Cloudflare CI credentials are not configured. See docs/pr-previews.md.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Install locked dependencies
        if: github.event.action != 'closed'
        run: pnpm install --frozen-lockfile --strict-peer-dependencies --registry=https://registry.npmjs.org
      - name: Check preview orchestration and build frontend
        if: github.event.action != 'closed'
        run: |
          node scripts/pr-preview.mjs --self-test
          pnpm --filter @cheapai/web run build
      - name: Deploy or retire branch preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_EVENT_ACTION: ${{ github.event.action }}
        run: node scripts/pr-preview.mjs
      - name: 'Seed PR #5 preview QA account'
        if: github.event.action != 'closed' && github.event.pull_request.number == 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/seed-preview-qa.ts
      - name: 'Upload encrypted PR #5 QA credentials'
        if: always() && github.event.action != 'closed' && github.event.pull_request.number == 5
        uses: actions/upload-artifact@v4
        with:
          name: cheapai-pr5-qa-20261004
          path: .wrangler/qa-preview-credentials.enc.json
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: ignore
