name: Local checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, lint, build and browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies --registry=https://registry.npmjs.org

      - name: Typecheck all workspaces
        run: pnpm run typecheck && pnpm run typecheck:desktop

      - name: Run all tests
        run: pnpm run test

      - name: Build all workspaces
        run: pnpm run build && pnpm run build:desktop

      - name: Check React and shared package style
        run: pnpm run lint:web && pnpm run lint:shared && pnpm run format:check:web

      - name: Install Playwright Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser flows against React application
        env:
          CHEAPAI_E2E_REUSE_BUILD: '1'
        run: pnpm exec playwright test
