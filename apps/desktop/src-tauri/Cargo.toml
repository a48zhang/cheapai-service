[package]
name = "sub2api-desktop"
version = "0.0.0"
description = "cheapai.dev desktop application"
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"

[lib]
name = "sub2api_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "=2.4.1"

[dependencies]
keyring = { version = "=3.6.3", default-features = false, features = [
  "apple-native",
  "windows-native",
  "linux-native-sync-persistent",
  "crypto-rust",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "=2.8.5"
tauri-plugin-dialog = "=2.3.0"
tauri-plugin-opener = "=2.5.0"
tauri-plugin-updater = "=2.9.0"
tokio = { version = "1", features = ["io-util", "process", "sync", "time"] }
